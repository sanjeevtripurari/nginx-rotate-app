<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Random Insights 💭</title>
    <meta http-equiv="refresh" content="5">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(to right, #a8e063, #56ab2f);
        }

        h1 {
            margin-top: 40px;
            color: #1e3d2b;
        }

        .card {
            margin: 40px auto;
            padding: 25px;
            width: 60%;
            border-radius: 12px;
            background: rgba(255,255,255,0.92);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .quote {
            white-space: pre-wrap;
            font-size: 16px;
            line-height: 1.6;
            color: #1e3d2b;
        }
    </style>
</head>

<body>

<h1>Random Insights 💭</h1>

<div class="card">
    <h3>✨ Inspiration Stream</h3>

    <pre class="quote">{{QUOTE}}</pre>

</div>

</body>
</html>
