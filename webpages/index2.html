<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Daily Wisdom 📘</title>
    <meta http-equiv="refresh" content="5">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
        }

        h1 {
            margin-top: 40px;
            color: #4a2c2a;
        }

        .card {
            margin: 40px auto;
            padding: 25px;
            width: 60%;
            border-radius: 12px;
            background: rgba(255,248,240,0.95);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .quote {
            white-space: pre-wrap;
            font-size: 16px;
            line-height: 1.6;
            color: #4a2c2a;
        }
    </style>
</head>

<body>

<h1>Daily Wisdom 📘</h1>

<div class="card">
    <h3>🌟 Thought for the Day</h3>

    <pre class="quote">{{QUOTE}}</pre>

</div>

</body>
</html>
