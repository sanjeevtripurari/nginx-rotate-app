<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Morning Thoughts ☀️</title>
    <meta http-equiv="refresh" content="5">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
        }

        h1 {
            margin-top: 40px;
            color: #2c3e50;
        }

        .card {
            margin: 40px auto;
            padding: 25px;
            width: 60%;
            border-radius: 12px;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .quote {
            white-space: pre-wrap;
            font-size: 16px;
            line-height: 1.6;
            color: #2c3e50;
        }

        .footer {
            margin-top: 10px;
            font-style: italic;
            color: #555;
        }
    </style>
</head>

<body>

<h1>Morning Thoughts ☀️</h1>

<div class="card">
    <h3>💡 Quote of the Moment</h3>

    <pre class="quote">{{QUOTE}}</pre>

</div>

</body>
</html>
